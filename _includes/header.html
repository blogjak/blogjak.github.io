<header class="site-header">
  <div class="container header-inner">
    <!-- Logo -->
    <a href="{{ '/' | relative_url }}" class="site-logo">
      <span class="logo-mark"><i class="fa-solid fa-blog"></i></span>
      <span class="logo-text">
        <strong>Blogjak</strong><em>Theme</em>
      </span>
    </a>

    <!-- Navigasi -->
    <nav class="nav-menu" id="nav-menu" aria-label="Navigasi utama">
      <ul>
        <li><a href="{{ '/' | relative_url }}"><i class="fa-solid fa-house"></i> Beranda</a></li>
        <li><a href="{{ '/categories/' | relative_url }}"><i class="fa-solid fa-folder"></i> Kategori</a></li>
        <li><a href="{{ '/tags/' | relative_url }}"><i class="fa-solid fa-tags"></i> Tag</a></li>
        <li><a href="{{ '/archive/' | relative_url }}"><i class="fa-solid fa-box-archive"></i> Arsip</a></li>
        <li><a href="{{ '/about/' | relative_url }}"><i class="fa-solid fa-circle-info"></i> Tentang</a></li>
        <li><a href="{{ '/contact/' | relative_url }}"><i class="fa-solid fa-envelope"></i> Kontak</a></li>
      </ul>
    </nav>

    <!-- Actions -->
    <div class="header-actions">
      {% if site.search.enabled %}
      <button class="search-toggle" data-search-open aria-label="Cari artikel" type="button" onclick="openBlogjakSearch(event); return false;">
        <svg viewBox="0 0 24 24" width="18" height="18"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </button>
      {% endif %}

      <button class="theme-toggle" data-theme-toggle aria-label="Ganti tema" type="button">
        <svg class="theme-icon icon-moon" viewBox="0 0 24 24" width="20" height="20"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="theme-icon icon-sun" viewBox="0 0 24 24" width="20" height="20"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>

      <button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false" type="button">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>

{% if site.search.enabled %}
<div class="search-modal" id="search-modal" role="dialog" aria-modal="true" aria-labelledby="search-title" hidden>
  <div class="search-backdrop" data-search-close></div>

  <div class="search-container">
    <div class="search-header">
      <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
      <input
        type="search"
        id="search-input"
        class="search-input"
        placeholder="{{ site.search.placeholder | default: 'Cari artikel...' }}"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Cari artikel">
      <button class="search-close" data-search-close aria-label="Tutup pencarian" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div class="search-results" id="search-results" aria-live="polite">
      <p class="search-hint">
        <i class="fa-solid fa-lightbulb"></i>
        Ketik kata kunci untuk mulai mencari...
      </p>
    </div>

    <div class="search-footer">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigasi</span>
      <span><kbd>Enter</kbd> buka</span>
      <span><kbd>Esc</kbd> tutup</span>
    </div>
  </div>
</div>
{% endif %}
